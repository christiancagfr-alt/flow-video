name: Build desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-installers
  cancel-in-progress: false
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/build_macos.py --arch "$BUILD_ARCH"
        env:
          BUILD_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-macos-${{ matrix.arch }}
          path: dist/*.dmg*
          if-no-files-found: error
          compression-level: 0
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install packaging==26.3
      - run: python scripts/build_windows_installer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-windows
          path: dist/*.exe*
          if-no-files-found: error
          compression-level: 0
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libpulse0 libasound2 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libx11-xcb1 libxcb-glx0 libxcb-xinput0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-randr0 xvfb
          python -m pip install pillow==12.3.0
      - run: python scripts/build_linux.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-linux
          path: dist/*.deb*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified installers together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c 'from app.version import VERSION; print(VERSION)')
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Flow Studio $VERSION · Desktop installers" --notes-file RELEASE_NOTES.md --draft release-assets/*
          gh release edit "v$VERSION" --draft=false --latest
