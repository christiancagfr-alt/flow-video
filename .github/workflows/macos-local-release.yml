name: Local source macOS release
on:
  push:
    branches: ['release/local-macos-1.1.16']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build and verify native macOS application
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: python scripts/build_macos.py --arch "$BUILD_ARCH"
      - name: Audit packaged dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          ROOT='build/macos/Flow Studio.app/Contents/Resources'
          python -m pip_audit --path "$ROOT/python/lib/python3.13/site-packages" --path "$ROOT/bundled-components/packaging/asr-libs" --path "$ROOT/bundled-components/packaging/ffmpeg-libs"
          cd "$ROOT/bundled-components/packaging/remotion"
          npm audit --omit=dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-macos-${{ matrix.arch }}
          path: dist/*.dmg*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: installer-macos-*
          merge-multiple: true
          path: release-assets
      - name: Add verified macOS installers to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          sha256sum -c *.sha256
          gh release upload v1.1.16 *.dmg *.sha256
