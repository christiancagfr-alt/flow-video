name: Local source Windows release
on:
  push:
    branches: ['release/local-windows-1.1.16']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-windows-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Extension regression
        shell: pwsh
        run: |
          $tests = Get-ChildItem 'extension/*/tests/*.test.cjs' | ForEach-Object { $_.FullName }
          $tests += Get-ChildItem 'tests/*.js' | ForEach-Object { $_.FullName }
          node --test $tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m pip install packaging==26.3
      - name: Build, test and install Windows package
        run: python scripts/build_windows_installer.py
      - name: Test packaged Pillow and video encoders
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FLOWSTUDIO_DATA_DIR: ${{ github.workspace }}/build/media-test-data
        run: |
          & build/FlowStudio-Windows/runtime/python.exe build/FlowStudio-Windows/scripts/smoke_media.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit the actual packaged dependency trees
        shell: pwsh
        run: |
          python -m pip install pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip_audit --path build/FlowStudio-Windows/runtime/Lib/site-packages --path build/FlowStudio-Windows/bundled-components/packaging/asr-libs --path build/FlowStudio-Windows/bundled-components/packaging/ffmpeg-libs --format json --output audit/windows-package-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location build/FlowStudio-Windows/bundled-components/packaging/remotion
          npm audit --omit=dev --json | Out-File -Encoding utf8 ../../../../../audit/windows-npm-audit.json
          $auditExit = $LASTEXITCODE
          Pop-Location
          if ($auditExit -ne 0) { exit $auditExit }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-windows
          path: dist/*.exe*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-validation
          path: |
            audit/wheel-manifest.json
            audit/cpython-build.log
            audit/cpython-tests.log
            audit/cpython-build-manifest.json
            audit/windows-package-audit.json
            audit/windows-npm-audit.json
            build/FlowStudio-Windows/RUNTIME_MANIFEST.json
            build/FlowStudio-Windows/build/media-regression/results.json
            build/FlowStudio-Windows/build/media-regression/*/ffmpeg.log
          if-no-files-found: warn
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: installer-windows
          path: release-assets
      - name: Publish verified Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c 'from app.version import VERSION; print(VERSION)')
          cd release-assets
          sha256sum -c *.sha256
          cd ..
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Flow Studio $VERSION · Windows" --notes-file RELEASE_NOTES.md --draft release-assets/*
          gh release edit "v$VERSION" --draft=false --latest
